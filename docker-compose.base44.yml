# Base44 development compose — runs the Vite dev server from the cloned source
# so edits appear via live reload. Supabase is provided by the user's hosted
# project (credentials delivered via /run/base44/app.env).
services:
  install:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: npm install
    restart: "no"

  web:
    image: node:22
    working_dir: /app
    depends_on:
      install:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    restart: unless-stopped

volumes:
  node_modules:
